@let isCollapsed = store.collapsed();

<div
	class="w-full h-full flex gap-2 items-center justify-center overflow-hidden shrink-0"
>
	<div
		class="w-8 h-8 rounded flex items-center justify-center"
		[style.backgroundColor]="theme.primary"
	>
		<span class="material-symbols-outlined text-white">anchor</span>
	</div>
	@if (!isCollapsed) {
	<span
		class="font-black tracking-widest italic overflow-hidden whitespace-nowrap"
	>
		<span [style.color]="theme.coral">秋雲</span>先生取材中
	</span>
	}
</div>
