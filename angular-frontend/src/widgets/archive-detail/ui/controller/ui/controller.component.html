<p-toolbar class="w-full">
	<ng-template #start>
		<p-button
			icon="pi  pi-arrow-left"
			[outlined]="true"
			styleClass="w-11 h-11 !rounded-2xl border-white/5 !text-cyan-400 hover:bg-white/5"
		></p-button>
	</ng-template>

	<!-- <ng-template #center> </ng-template> -->

	<ng-template #end>
		<p-button
			icon="pi pi-download"
			[outlined]="true"
			styleClass="w-11 h-11 !rounded-2xl border-white/5 !text-cyan-400 hover:bg-white/5"
		></p-button>
		<p-splitbutton label="Save" [model]="items" />
	</ng-template>
</p-toolbar>
