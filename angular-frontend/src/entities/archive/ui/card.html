@let e = entry();

<article
	class="relative px-3 pb-12 pt-10"
	(mouseenter)="cardMouseEnter.emit()"
	(mouseleave)="cardMouseLeave.emit()"
>
	<!-- Card Container -->
	<div
		class="group relative h-[340px] w-full cursor-pointer rounded md:h-[380px]"
	>
		<!-- Shadow Layer -->
		<div
			class="absolute inset-0 rounded bg-[#18181b] shadow-[0_4px_12px_rgba(0,0,0,0.55)] transition-transform duration-500 group-hover:scale-[0.98]"
		></div>

		<!-- Main Content -->
		<div
			class="absolute inset-0 z-10 overflow-hidden rounded transition-all duration-500"
			[class.p-0]="!isHovered()"
			[class.p-3]="isHovered()"
		>
			<div
				class="relative h-full w-full overflow-hidden rounded-lg bg-[#050505]"
			>
				<!-- Background Image -->
				@if (coverUrl) {
				<img
					[src]="coverUrl"
					alt="{{ e.name }}"
					class="[transform:translateZ(0)] absolute inset-0 z-[5] h-full w-full object-cover opacity-85 transition duration-700"
					[class.scale-105]="isHovered()"
					loading="lazy"
				>
				} @else {
				<!-- Icon fallback when no image is available -->
				<div
					class="absolute inset-0 z-20 flex items-center justify-center"
				>
					<svg
						viewBox="0 0 24 24"
						fill="currentColor"
						aria-hidden="true"
						class="h-[84px] w-[84px] text-[#d8d4d1] transition-all duration-700"
						[class.opacity-60]="!isHovered()"
						[class.opacity-20]="isHovered()"
						[class.text-\[#3bb2bf\]]="isHovered()"
						[class.scale-150]="isHovered()"
					>
						<path [attr.d]="iconPath()"></path>
					</svg>
				</div>
				}

				<!-- Color Gradient Overlay -->
				<div
					class="absolute inset-0 z-10 opacity-40 transition duration-700"
					[class]="bgGradient()"
					[class.scale-110]="isHovered()"
					[class.rotate-2]="isHovered()"
				></div>
				<!-- Scan Line Effect -->
				@if (isHovered()) {
				<div
					class="absolute left-0 right-0 z-30 h-[2px] animate-[scan-y_2s_linear_infinite] bg-[linear-gradient(90deg,transparent,rgba(59,178,191,0.55),transparent)]"
				></div>
				}
			</div>
		</div>
	</div>
